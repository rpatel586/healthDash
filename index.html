<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitness Activity Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- PapaParse for CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Header Section -->
    <header class="flex flex-col md:flex-row justify-between items-center bg-gray-800 p-6 rounded-xl shadow-md border border-gray-700">
      <div>
        <h1 class="text-3xl font-bold text-white">Fitness Activity Dashboard</h1>
        <p class="text-sm text-gray-400 mt-1">Live metrics parsed directly from your Google Sheet tracker</p>
      </div>
      <div class="mt-4 md:mt-0 flex items-center space-x-3 w-full md:w-auto">
        <input 
          type="text" 
          id="sheetUrl" 
          value="https://docs.google.com/spreadsheets/d/e/2PACX-1vQR_NpghLCqPc7iZaUVGCGfiMBn-BdJDAcvuLtAAxpZiV1-yq1IqCw5IhjUvwg4oMNU9UFCFWkhjE6t/pub?output=csv"
          placeholder="Published Google Sheet CSV URL" 
          class="bg-gray-700 text-white px-4 py-2 rounded-lg border border-gray-600 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-full md:w-80"
        />
        <button 
          onclick="loadDashboardData()" 
          class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition-colors shadow">
          Refresh
        </button>
      </div>
    </header>

    <!-- Date Selection Controls -->
    <div class="flex items-center justify-between bg-gray-800 px-6 py-4 rounded-xl border border-gray-700">
      <div class="flex items-center space-x-2">
        <label for="dateSelect" class="text-sm font-medium text-gray-300">Select Viewing Date:</label>
        <select id="dateSelect" onchange="updateDashboardView()" class="bg-gray-700 text-white px-3 py-1.5 rounded-md border border-gray-600 text-sm focus:outline-none">
          <option value="">Loading dates...</option>
        </select>
      </div>
      <div id="lastUpdated" class="text-xs text-gray-400">Status: Initializing auto-load...</div>
    </div>

    <!-- Summary Stat Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-sm">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Total Steps</span>
        <div id="metricSteps" class="text-3xl font-extrabold text-blue-400 mt-2">--</div>
      </div>
      <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-sm">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Distance</span>
        <div id="metricDistance" class="text-3xl font-extrabold text-emerald-400 mt-2">--</div>
      </div>
      <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-sm">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Active Calories</span>
        <div id="metricCalories" class="text-3xl font-extrabold text-amber-400 mt-2">--</div>
      </div>
      <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-sm">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">VO2 Max</span>
        <div id="metricVo2" class="text-3xl font-extrabold text-purple-400 mt-2">--</div>
      </div>
    </div>

    <!-- Analytics Charts Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-sm">
        <h2 class="text-base font-semibold text-gray-200 mb-4">Steps Progression Over Time</h2>
        <div class="relative h-64">
          <canvas id="stepsChart"></canvas>
        </div>
      </div>
      <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-sm">
        <h2 class="text-base font-semibold text-gray-200 mb-4">Active Calories Burned</h2>
        <div class="relative h-64">
          <canvas id="caloriesChart"></canvas>
        </div>
      </div>
    </div>

  </div>

  <script>
    let rawParsedData = [];
    let groupedByDate = {};
    let stepsChartInstance = null;
    let caloriesChartInstance = null;

    // Automatically load data as soon as the DOM fully loads
    window.addEventListener('DOMContentLoaded', () => {
      loadDashboardData();
    });

    // Custom date parser for strings formatted like "17 Oct 2026 at 20:54"
    function parseCustomDate(dateStr) {
      if (!dateStr) return null;
      const cleanStr = dateStr.replace(' at ', ' ');
      const parsedDate = new Date(cleanStr);
      return isNaN(parsedDate.getTime()) ? null : parsedDate;
    }

    function loadDashboardData() {
      let url = document.getElementById('sheetUrl').value.trim();
      const statusEl = document.getElementById('lastUpdated');

      if (!url) {
        alert('Please enter a valid Google Sheet URL.');
        return;
      }

      // Automatically convert web output/pubhtml link to direct CSV output format
      if (url.includes('/pubhtml')) {
        url = url.replace('/pubhtml', '/pub?output=csv');
        document.getElementById('sheetUrl').value = url;
      } else if (!url.includes('output=csv') && url.includes('/pub')) {
        url = url.includes('?') ? `${url}&output=csv` : `${url}?output=csv`;
        document.getElementById('sheetUrl').value = url;
      }

      statusEl.textContent = 'Status: Fetching live spreadsheet data...';

      Papa.parse(url, {
        download: true,
        header: false,
        skipEmptyLines: true,
        complete: function(results) {
          processRawCsvData(results.data);
          statusEl.textContent = `Status: Updated at ${new Date().toLocaleTimeString()}`;
        },
        error: function(err) {
          console.error(err);
          statusEl.textContent = 'Status: Error fetching CSV.';
          alert('Failed to parse Google Sheet CSV. Make sure the document is published to the web.');
        }
      });
    }

    function processRawCsvData(rows) {
      groupedByDate = {};
      rawParsedData = [];

      // Locate row index containing column headers (scanning for 'date')
      let headerRowIndex = -1;
      for (let i = 0; i < Math.min(10, rows.length); i++) {
        if (rows[i][0] && rows[i][0].toString().toLowerCase().trim() === 'date') {
          headerRowIndex = i;
          break;
        }
      }

      const dataRows = headerRowIndex !== -1 ? rows.slice(headerRowIndex + 1) : rows;

      dataRows.forEach(row => {
        const rawDateStr = row[0];
        const dateObj = parseCustomDate(rawDateStr);

        if (dateObj) {
          const dateKey = dateObj.toISOString().split('T')[0]; // YYYY-MM-DD
          const timeLabel = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          const entry = {
            timestamp: dateObj,
            timeLabel: timeLabel,
            steps: parseFloat(row[1]) || 0,
            distance: parseFloat(row[2]) || 0,
            vo2max: parseFloat(row[3]) || 0,
            calories: parseFloat(row[4]) || 0
          };

          rawParsedData.push(entry);

          if (!groupedByDate[dateKey]) {
            groupedByDate[dateKey] = [];
          }
          groupedByDate[dateKey].push(entry);
        }
      });

      populateDateSelector();
      updateDashboardView();
    }

    function populateDateSelector() {
      const dateSelect = document.getElementById('dateSelect');
      dateSelect.innerHTML = '';

      const availableDates = Object.keys(groupedByDate).sort().reverse();

      if (availableDates.length === 0) {
        const opt = document.createElement('option');
        opt.textContent = 'No valid records found';
        dateSelect.appendChild(opt);
        return;
      }

      availableDates.forEach((dateStr, idx) => {
        const opt = document.createElement('option');
        opt.value = dateStr;
        const formattedDate = new Date(dateStr + 'T00:00:00').toLocaleDateString(undefined, { 
          weekday: 'short', 
          year: 'numeric', 
          month: 'short', 
          day: 'numeric' 
        });
        opt.textContent = idx === 0 ? `${formattedDate} (Latest)` : formattedDate;
        dateSelect.appendChild(opt);
      });
    }

    function updateDashboardView() {
      const selectedDateKey = document.getElementById('dateSelect').value;
      const dayEntries = groupedByDate[selectedDateKey] || [];

      if (dayEntries.length === 0) return;

      // Chronological sort for linear chart rendering
      dayEntries.sort((a, b) => a.timestamp - b.timestamp);

      // Latest hourly snapshot of selected date
      const latestRecord = dayEntries[dayEntries.length - 1];

      document.getElementById('metricSteps').textContent = latestRecord.steps.toLocaleString();
      document.getElementById('metricDistance').textContent = `${latestRecord.distance.toFixed(2)} km`;
      document.getElementById('metricCalories').textContent = `${latestRecord.calories.toFixed(1)} kcal`;
      document.getElementById('metricVo2').textContent = latestRecord.vo2max > 0 ? latestRecord.vo2max.toFixed(2) : '--';

      renderCharts(dayEntries);
    }

    function renderCharts(entries) {
      const labels = entries.map(e => e.timeLabel);
      const stepsData = entries.map(e => e.steps);
      const caloriesData = entries.map(e => e.calories);

      // Render Steps Progression Chart
      const ctxSteps = document.getElementById('stepsChart').getContext('2d');
      if (stepsChartInstance) stepsChartInstance.destroy();

      stepsChartInstance = new Chart(ctxSteps, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Steps',
            data: stepsData,
            borderColor: '#60a5fa',
            backgroundColor: 'rgba(96, 165, 250, 0.15)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' } },
            y: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' } }
          }
        }
      });

      // Render Active Calories Bar Chart
      const ctxCalories = document.getElementById('caloriesChart').getContext('2d');
      if (caloriesChartInstance) caloriesChartInstance.destroy();

      caloriesChartInstance = new Chart(ctxCalories, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Active Cals',
            data: caloriesData,
            backgroundColor: '#f59e0b',
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' } },
            y: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' } }
          }
        }
      });
    }
  </script>
</body>
</html>
